<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sounds of Home</title>
</head>
<body>

<h1>Sounds of Home</h1>
<p id="intro">A 60 to 90 second soundscape of my hometown, from morning to night.</p>

<h2>Soundscape</h2>

<audio id="player" controls>
<source src="audio/soundscape.mp3" type="audio/mpeg">
This browser does not support audio.
</audio>

<h2>Visualscape</h2>

<div id="scene">
<img id="sceneImg" src="images/morning.jpg" alt="Morning in my hometown">
<p id="sceneLabel">Morning</p>
</div>

<video id="clip" controls muted loop>
<source src="video/street.mp4" type="video/mp4">
This browser does not support video.
</video>

<div id="times">
<img id="morningPic" src="images/morning.jpg" alt="Morning">
<img id="afternoonPic" src="images/afternoon.jpg" alt="Afternoon">
<img id="nightPic" src="images/night.jpg" alt="Night">
</div>

<p id="credits">Sounds from Freesound.org. Photos and video from Pexels.</p>

</body>
</html>
